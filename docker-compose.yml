services:
  postgres:
    image: postgres:16-alpine
    container_name: trackify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackify
      POSTGRES_PASSWORD: trackify
      POSTGRES_DB: trackify
    ports:
      - "5432:5432"
    volumes:
      - trackify-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackify -d trackify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackify-pg:
